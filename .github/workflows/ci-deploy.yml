# .NET·Unity 검증 → Windows·Linux·WebGL 빌드 → Pages. v* 태그는 데스크톱 Releases.
name: CI / Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "이 태그(예: v0.1.0)로 Releases 를 만든다. 비우면 배포만"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: "6000.3.27f1"
  DOTNET_VERSION: "8.0.426"

jobs:
  core:
    name: .NET 시뮬레이션·동일 시드 검증
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: C# 단위·통계 테스트
        run: |
          ./tools/run_dotnet_tests.sh
          ./tools/run_dotnet_tests.sh --filter "Name~ColumnAttackTradesWorseThanLine|Name~ForestEdgeHelpsDefender"
      - name: Unity 데이터 복사본 동기화 검사
        run: python3 tools/sync_unity_data.py --check
      - name: 8개 시드 골든 비교
        run: ./tools/check_golden.sh
      - name: 검증 산출물
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-check
          path: build/validation/golden_check.json

  unity-tests:
    name: Unity ${{ matrix.testMode }}
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-tests-${{ matrix.testMode }}-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**', 'src/Echelon.Core/**') }}
          restore-keys: Library-tests-${{ matrix.testMode }}-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: ${{ matrix.testMode }}
          coverageEnabled: false
          artifactsPath: artifacts/${{ matrix.testMode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity ${{ matrix.testMode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-tests-${{ matrix.testMode }}
          path: ${{ steps.tests.outputs.artifactsPath }}

  export:
    name: Unity ${{ matrix.output }} 빌드
    needs: unity-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: StandaloneWindows64
            output: windows
            artifact: windows-x86_64
          - targetPlatform: StandaloneLinux64
            output: linux
            artifact: linux-x86_64
          - targetPlatform: WebGL
            output: web
            artifact: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: unity/Library
          key: Library-build-${{ matrix.targetPlatform }}-${{ hashFiles('unity/Assets/**', 'unity/Packages/**', 'unity/ProjectSettings/**', 'src/Echelon.Core/**') }}
          restore-keys: Library-build-${{ matrix.targetPlatform }}-
      - name: 빌드
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: Echelon.Unity.Editor.EchelonBuild.Build${{ matrix.targetPlatform == 'WebGL' && 'Web' || matrix.output == 'windows' && 'Windows' || 'Linux' }}
          versioning: None
          customParameters: -quit -batchmode -nographics
      - name: 데스크톱 패키지
        if: matrix.output != 'web'
        run: |
          cp unity/Assets/Fonts/OFL.txt build/unity/${{ matrix.output }}/
          mkdir -p build/packages
          (cd build/unity/${{ matrix.output }} && zip -qr ../../packages/echelon-${{ matrix.artifact }}.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: echelon-${{ matrix.artifact }}
          path: |
            build/unity/${{ matrix.output }}/
            build/packages/
      - uses: actions/upload-pages-artifact@v3
        if: matrix.output == 'web'
        with:
          path: build/unity/web

  deploy-pages:
    name: GitHub Pages 배포
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Releases 업로드
    needs: export
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: echelon-*
          path: dist
      - name: 데스크톱 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "${TAG}" dist/packages/* --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "ECHELON ${TAG}" \
            --notes "웹에서 바로 하기: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/ (브라우저는 큰 전투에서 느릴 수 있습니다)

          - Windows: echelon-windows-x86_64.zip 을 풀고 Echelon.exe 실행 (서명되지 않아 SmartScreen 경고가 뜰 수 있음 → 추가 정보 → 실행)
          - Linux: echelon-linux-x86_64.zip 을 풀고 ./Echelon.x86_64 실행"
