# 테스트 → 내보내기(웹·Windows·Linux) → GitHub Pages 배포, v* 태그면 Releases 에 실행 파일 첨부.
name: CI / Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN: /opt/godot/Godot_v4.7.2-stable_linux.x86_64

jobs:
  test:
    name: 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Godot 캐시
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: /opt/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Godot 받기
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/godot && sudo chown "$USER" /opt/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /opt/godot
      - name: 정적 타입 검사
        run: GODOT=$GODOT_BIN ./tools/check_warnings.sh
      - name: GUT 테스트
        run: GODOT=$GODOT_BIN ./tools/run_tests.sh
      - name: 스모크(샌드박스·스커미시)
        run: GODOT=$GODOT_BIN ./tools/run_smoke.sh 100

  export:
    name: 내보내기
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Godot·내보내기 템플릿 캐시
        id: cache-export
        uses: actions/cache@v4
        with:
          path: |
            /opt/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-export
      - name: Godot·템플릿 받기
        if: steps.cache-export.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/godot && sudo chown "$USER" /opt/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /opt/godot
          curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -q -j /tmp/templates.tpz templates/version.txt templates/web_nothreads_release.zip templates/web_nothreads_debug.zip \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/linux_release.x86_64 templates/linux_debug.x86_64 -d "$T"
          rm /tmp/templates.tpz
      - name: 가져오기(import)
        run: $GODOT_BIN --headless --path . --import || true
      - name: 내보내기
        run: |
          mkdir -p build/web build/windows build/linux
          $GODOT_BIN --headless --path . --export-release "Web" build/web/index.html
          $GODOT_BIN --headless --path . --export-release "Windows" build/windows/Echelon.exe
          $GODOT_BIN --headless --path . --export-release "Linux" build/linux/Echelon.x86_64
          test -s build/web/index.wasm && test -s build/windows/Echelon.exe && test -s build/linux/Echelon.x86_64
      - name: 실행 파일 묶기
        run: |
          cp assets/fonts/OFL.txt build/windows/ && cp assets/fonts/OFL.txt build/linux/
          (cd build/windows && zip -q -r ../Echelon-windows-x86_64.zip .)
          (cd build/linux && chmod +x Echelon.x86_64 && tar -czf ../Echelon-linux-x86_64.tar.gz .)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-builds
          path: |
            build/Echelon-windows-x86_64.zip
            build/Echelon-linux-x86_64.tar.gz
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: GitHub Pages 배포
    needs: export
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Releases 업로드
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-builds
          path: dist
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --title "ECHELON ${GITHUB_REF_NAME}" \
            --notes "웹에서 바로 하기: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/ (브라우저는 큰 전투에서 느릴 수 있습니다)

          - Windows: Echelon-windows-x86_64.zip 을 풀고 Echelon.exe 실행 (서명되지 않아 SmartScreen 경고가 뜰 수 있음 → 추가 정보 → 실행)
          - Linux: Echelon-linux-x86_64.tar.gz 을 풀고 ./Echelon.x86_64 실행"
